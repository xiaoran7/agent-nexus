<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="nexus-grad-a" x1="8" y1="12" x2="56" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="nexus-grad-core" x1="24" y1="20" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="nexus-grad-glow" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Nexus Interconnection Mesh -->
  <polygon points="32,9 53,46 11,46" stroke="url(#nexus-grad-a)" stroke-width="2.2" stroke-linejoin="round" fill="url(#nexus-grad-glow)"/>

  <!-- Radial Coordination Vectors -->
  <line x1="32" y1="32" x2="32" y2="9" stroke="url(#nexus-grad-a)" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="11" y2="46" stroke="url(#nexus-grad-a)" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="53" y2="46" stroke="url(#nexus-grad-a)" stroke-width="2" stroke-linecap="round"/>

  <!-- Central Nexus Core Prism (Hexagonal Facet) -->
  <polygon points="32,23 40,28 40,36 32,41 24,36 24,28" fill="url(#nexus-grad-core)" stroke="#60a5fa" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>

  <!-- Satellite Agent Nodes -->
  <!-- Top Node -->
  <circle cx="32" cy="9" r="4.5" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="32" cy="9" r="2" fill="#38bdf8"/>

  <!-- Left Node -->
  <circle cx="11" cy="46" r="4.5" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="11" cy="46" r="2" fill="#60a5fa"/>

  <!-- Right Node -->
  <circle cx="53" cy="46" r="4.5" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
  <circle cx="53" cy="46" r="2" fill="#818cf8"/>
</svg>
