name: Bug Report
description: Report an issue or unexpected behavior in Agent-Nexus
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve the problem.
  - type: input
    id: version
    attributes:
      label: Agent-Nexus Version
      description: What version are you running? (Run `nexus --version` or check package version)
      placeholder: "e.g. 0.2.7"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Operating System / Environment
      options:
        - Windows
        - macOS
        - Linux / Ubuntu
        - WSL2
    validations:
      required: true
  - type: dropdown
    id: agent_runtime
    attributes:
      label: AI Agent Framework
      options:
        - Claude Code
        - OpenAI Codex
        - Cursor
        - Custom MCP Client
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Start daemon with `npx @xiaoran7/agent-nexus start`
        2. Run multiple agent sessions on...
        3. See error...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Please copy and paste any relevant terminal or daemon logs.
      render: shell
