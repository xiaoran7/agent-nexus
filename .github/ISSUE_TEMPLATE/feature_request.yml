name: Feature Request
description: Suggest an enhancement or new feature for Agent-Nexus
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make concurrent multi-agent coding even smoother? Tell us below!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific multi-agent friction point or limitation?
      placeholder: "e.g. When running 4+ agents across monorepos, I want to..."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision this working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've explored?
