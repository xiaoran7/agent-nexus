# Smithery configuration for Agent-Nexus
# Learn more at: https://smithery.ai/docs/config#smitheryyaml

name: "@xiaoran7/agent-nexus"
description: "Zero-overhead Multi-Agent Concurrency Coordinator & Cross-Machine Context Relay for Claude Code."

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      projectId:
        type: string
        description: "Optional project scope identifier to isolate coordination locks and engineering memories (defaults to 'default')"
        default: "default"
  commandFunction:
    command: "npx"
    args:
      - "-y"
      - "@xiaoran7/agent-nexus"
      - "mcp"
