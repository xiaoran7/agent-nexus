<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Agent-Nexus · 探针未连接</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(1200px 600px at 50% -10%, #17233c 0%, #0a0d16 60%);
    color: #e6ecf7;
    font-family: "Plus Jakarta Sans", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .card {
    width: min(560px, 92vw); padding: 34px 34px 28px;
    border-radius: 18px; border: 1px solid rgba(120, 160, 220, 0.18);
    background: rgba(18, 25, 40, 0.82);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%; display: inline-block;
    background: #f0a33c; box-shadow: 0 0 0 4px rgba(240, 163, 60, 0.16);
    margin-right: 9px; vertical-align: middle;
  }
  h1 { font-size: 19px; margin: 0 0 6px; letter-spacing: .2px; }
  .sub { color: #8ea1bd; font-size: 13px; margin: 0 0 24px; line-height: 1.7; }
  .step { margin: 0 0 16px; }
  .step-title { font-size: 12px; color: #7f93b2; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 7px; }
  code {
    display: block; padding: 11px 13px; border-radius: 10px;
    background: #0b1120; border: 1px solid rgba(120, 160, 220, 0.16);
    color: #9fd0ff; font-family: "JetBrains Mono", Consolas, monospace; font-size: 12.5px;
    user-select: all; word-break: break-all;
  }
  .status { margin-top: 22px; padding-top: 16px; border-top: 1px solid rgba(120, 160, 220, 0.12); font-size: 12.5px; color: #8ea1bd; display: flex; justify-content: space-between; }
  .status b { color: #c8d7ee; font-weight: 600; }
  a { color: #6db3ff; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <h1><span class="dot"></span>后台探针未连接</h1>
    <p class="sub">
      桌面端已改为纯客户端：它只负责显示面板，协调与数据全部由后台探针负责。
      探针不在线，所以现在没有可展示的数据。
    </p>

    <div class="step">
      <div class="step-title">首次使用 · 安装并开机自启探针</div>
      <code>nexus probe:install</code>
    </div>

    <div class="step">
      <div class="step-title">已安装但当前没跑 · 手动拉起</div>
      <code>nexus probe:start</code>
    </div>

    <div class="status">
      <span>探针地址 <b id="endpoint">—</b></span>
      <span id="hint">每 3 秒自动重连…</span>
    </div>
  </div>

  <script>
    const endpointEl = document.getElementById('endpoint');
    const hintEl = document.getElementById('hint');
    if (window.nexusDesktop && window.nexusDesktop.endpoint) {
      endpointEl.textContent = window.nexusDesktop.endpoint;
    }
    let dots = 0;
    setInterval(() => {
      dots = (dots + 1) % 4;
      hintEl.textContent = `每 3 秒自动重连${'.'.repeat(dots)}`;
    }, 700);
  </script>
</body>
</html>
